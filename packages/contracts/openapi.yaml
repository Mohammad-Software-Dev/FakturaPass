openapi: 3.1.0
info:
  title: FakturaPass Release A
  version: 1.0.0
  description: Local synthetic demonstrator. Production OIDC/API keys are gated
    and not enabled.
servers:
  - url: /api/v1
paths:
  /invoices:
    post:
      operationId: createInvoice
      description:
        Ingest canonical invoice; same key/body replays original response,
        changed body conflicts.
      security:
        - localDev: []
        - oidcBearer: []
        - apiKey: []
      parameters:
        - name: X-Request-Id
          in: header
          schema:
            type: string
            maxLength: 100
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
          description:
            Optional language preference for error messages and recipient
            display labels. Supports de and en (including regional tags and
            quality weights), default de. Codes, invoice data, XML and saved
            evidence are language-independent.
      responses:
        "201":
          description: Successful operation
          headers:
            X-Request-Id:
              schema: &a1
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvoice"
        "400":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
