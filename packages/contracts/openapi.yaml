            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvInput"
  /csv/import:
    post:
      operationId: importCsv
      description: Atomically commit a previewed CSV batch, retaining source and
        mapping provenance.
      security:
        - localDev: []
        - oidcBearer: []
        - apiKey: []
      parameters:
        - name: X-Request-Id
          in: header
          schema:
            type: string
            maxLength: 100
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
          description:
            Optional language preference for error messages and recipient
            display labels. Supports de and en (including regional tags and
            quality weights), default de. Codes, invoice data, XML and saved
            evidence are language-independent.
      responses:
        "200":
          description: Successful operation
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImported"
        "400":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Safe stable error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvCommit"
components:
  securitySchemes:
    localDev:
      type: http
      scheme: bearer
      description:
        Explicit LOCAL-only server configured bearer identity; loopback
        browser adapter requires LOCAL_BROWSER_IDENTITY and same-origin writes.
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Production contract only; unavailable in Release A.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Production contract only; unavailable in Release A.
  schemas:
    Invoice:
      type: object
      properties:
        schemaVersion:
          const: fakturapass.invoice.v1
        source:
          type: object
          properties:
            system:
              type: string
              minLength: 1
              maxLength: 100
            recordId:
              type: string
              minLength: 1
              maxLength: 200
            receivedAt:
              type: string
              minLength: 1
              format: date-time
            fileName:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 255
                - type: "null"
          required:
            - system
            - recordId
            - receivedAt
          additionalProperties: false
        document:
          type: object
          properties:
            type:
              const: INVOICE
            number:
              type: string
              minLength: 1
              maxLength: 100
            issueDate:
              type: string
              minLength: 1
              format: date
            currency:
              const: EUR
            buyerReference:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            purchaseOrderReference:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            contractReference:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
          required:
            - type
            - number
            - issueDate
            - currency
          additionalProperties: false
        seller:
          type: object
          properties:
            name:
              type: string
              minLength: 1
            tradingName:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            address:
              type: object
              properties:
                street:
                  type: string
                  minLength: 1
                additional:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                city:
                  type: string
                  minLength: 1
                postalCode:
                  type: string
                  minLength: 1
                countryCode:
                  const: DE
              required:
                - street
                - city
                - postalCode
                - countryCode
              additionalProperties: false
            vatId:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            taxNumber:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            electronicAddress:
              type: object
              properties:
                schemeId:
                  type: string
                  minLength: 1
                value:
                  type: string
                  minLength: 1
              required:
                - schemeId
                - value
              additionalProperties: false
            legalRegistrationId:
              anyOf:
                - type: object
                  properties:
                    schemeId:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                    value:
                      type: string
                      minLength: 1
                  required:
                    - value
                  additionalProperties: false
                - type: "null"
            contact:
              anyOf:
                - type: object
                  properties:
                    name:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                    email:
                      anyOf:
                        - type: string
                          minLength: 1
                          format: email
                        - type: "null"
                    phone:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                  required: []
                  additionalProperties: false
                - type: "null"
          required:
            - name
            - address
            - electronicAddress
          additionalProperties: false
        buyer:
          type: object
          properties:
            name:
              type: string
              minLength: 1
            tradingName:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            address:
              type: object
              properties:
                street:
                  type: string
                  minLength: 1
                additional:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                city:
                  type: string
                  minLength: 1
                postalCode:
                  type: string
                  minLength: 1
                countryCode:
                  const: DE
              required:
                - street
                - city
                - postalCode
                - countryCode
              additionalProperties: false
            vatId:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            taxNumber:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
            electronicAddress:
              type: object
              properties:
                schemeId:
                  type: string
                  minLength: 1
                value:
                  type: string
                  minLength: 1
              required:
                - schemeId
                - value
              additionalProperties: false
            legalRegistrationId:
              anyOf:
                - type: object
                  properties:
                    schemeId:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                    value:
                      type: string
                      minLength: 1
                  required:
                    - value
                  additionalProperties: false
                - type: "null"
            contact:
              anyOf:
                - type: object
                  properties:
                    name:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                    email:
                      anyOf:
                        - type: string
                          minLength: 1
                          format: email
                        - type: "null"
                    phone:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                  required: []
                  additionalProperties: false
                - type: "null"
          required:
            - name
            - address
            - electronicAddress
          additionalProperties: false
        lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              description:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              quantity:
                type: string
                minLength: 1
                pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
                maxLength: 64
              unitCode:
                type: string
                minLength: 1
              unitPrice:
                type: object
                properties:
                  amount:
                    type: string
                    minLength: 1
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                    maxLength: 64
                  baseQuantity:
                    type: string
                    minLength: 1
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                    maxLength: 64
                required:
                  - amount
                  - baseQuantity
                additionalProperties: false
              lineNetAmount:
                type: string
                minLength: 1
                pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
                maxLength: 64
              tax:
                type: object
                properties:
                  categoryCode:
                    type: string
                    minLength: 1
                  rate:
                    type: string
                    minLength: 1
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                    maxLength: 64
                required:
                  - categoryCode
                  - rate
                additionalProperties: false
              allowancesCharges:
                type: array
                items:
                  type: object
                  properties:
                    charge:
                      type: boolean
                    amount:
                      type: string
                      minLength: 1
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                      maxLength: 64
                    reason:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                    reasonCode:
                      anyOf:
                        - type: string
                          minLength: 1
                        - type: "null"
                    baseAmount:
                      anyOf:
                        - type: string
                          minLength: 1
                          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                          maxLength: 64
                        - type: "null"
                    percentage:
                      anyOf:
                        - type: string
                          minLength: 1
                          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                          maxLength: 64
                        - type: "null"
                    tax:
                      anyOf:
                        - type: object
                          properties:
                            categoryCode:
                              type: string
                              minLength: 1
                            rate:
                              type: string
                              minLength: 1
                              pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                              maxLength: 64
                          required:
                            - categoryCode
                            - rate
                          additionalProperties: false
                        - type: "null"
                  required:
                    - charge
                    - amount
                  additionalProperties: false
                minItems: 0
                maxItems: 1000
              buyerAccountingReference:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              purchaseOrderLineReference:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
            required:
              - id
              - name
              - quantity
              - unitCode
              - unitPrice
              - lineNetAmount
              - tax
              - allowancesCharges
            additionalProperties: false
          minItems: 1
          maxItems: 1000
        allowancesCharges:
          type: array
          items:
            type: object
            properties:
              charge:
                type: boolean
              amount:
                type: string
                minLength: 1
                pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                maxLength: 64
              reason:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              reasonCode:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              baseAmount:
                anyOf:
                  - type: string
                    minLength: 1
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                    maxLength: 64
                  - type: "null"
              percentage:
                anyOf:
                  - type: string
                    minLength: 1
                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                    maxLength: 64
                  - type: "null"
              tax:
                anyOf:
                  - type: object
                    properties:
                      categoryCode:
                        type: string
                        minLength: 1
                      rate:
                        type: string
                        minLength: 1
                        pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                        maxLength: 64
                    required:
                      - categoryCode
                      - rate
                    additionalProperties: false
                  - type: "null"
            required:
              - charge
              - amount
            additionalProperties: false
          minItems: 0
          maxItems: 1000
        taxBreakdown:
          type: array
          items:
            type: object
            properties:
              categoryCode:
                type: string
                minLength: 1
              rate:
                type: string
                minLength: 1
                pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                maxLength: 64
              taxableAmount:
                type: string
                minLength: 1
                pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
                maxLength: 64
              taxAmount:
                type: string
                minLength: 1
                pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
                maxLength: 64
            required:
              - categoryCode
              - rate
              - taxableAmount
              - taxAmount
            additionalProperties: false
          minItems: 1
          maxItems: 1000
        totals:
          type: object
          properties:
            lineNetAmount:
              type: string
              minLength: 1
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            allowanceTotal:
              type: string
              minLength: 1
              pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            chargeTotal:
              type: string
              minLength: 1
              pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            taxExclusiveAmount:
              type: string
              minLength: 1
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            taxAmount:
              type: string
              minLength: 1
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            taxInclusiveAmount:
              type: string
              minLength: 1
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            prepaidAmount:
              type: string
              minLength: 1
              pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            payableRoundingAmount:
              type: string
              minLength: 1
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
            payableAmount:
              type: string
              minLength: 1
              pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
              maxLength: 64
          required:
            - lineNetAmount
            - allowanceTotal
            - chargeTotal
            - taxExclusiveAmount
            - taxAmount
            - taxInclusiveAmount
            - prepaidAmount
            - payableRoundingAmount
            - payableAmount
          additionalProperties: false
        payment:
          anyOf:
            - type: object
              properties:
                meansCode:
                  type: string
                  minLength: 1
                dueDate:
                  anyOf:
                    - type: string
                      minLength: 1
                      format: date
                    - type: "null"
                terms:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                iban:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                bic:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                accountName:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                paymentReference:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
              required:
                - meansCode
              additionalProperties: false
            - type: "null"
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              fileName:
                type: string
                minLength: 1
              mediaType:
                type: string
                minLength: 1
              description:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              objectKey:
                anyOf:
                  - type: string
                    minLength: 1
                  - type: "null"
              sha256:
                anyOf:
                  - type: string
                    minLength: 1
                    pattern: ^[a-f0-9]{64}$
                  - type: "null"
            required:
              - id
              - fileName
              - mediaType
            additionalProperties: false
          minItems: 0
          maxItems: 1000
        extensions:
          type: object
      required:
        - schemaVersion
        - source
        - document
        - seller
        - buyer
        - lines
        - allowancesCharges
        - taxBreakdown
        - totals
        - attachments
        - extensions
      additionalProperties: false
    Empty:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    Correction:
      type: object
      properties:
        priorRevisionId:
          type: string
        canonical:
          $ref: "#/components/schemas/Invoice"
      required:
        - priorRevisionId
        - canonical
      additionalProperties: false
    ValidationRequest:
      type: object
      properties:
        recipientProfileVersionId:
          type:
            - string
            - "null"
      required: []
      additionalProperties: false
    ApprovalRequest:
      type: object
      properties:
        validationRunId:
          type: string
        recipientProfileVersionId:
          type:
            - string
            - "null"
      required:
        - validationRunId
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
          required:
            - code
            - message
            - requestId
            - details
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Finding:
      type: object
      properties:
        code:
          type: string
        severity:
          enum:
            - ERROR
            - WARNING
            - INFO
        layer:
          enum:
            - SCHEMA
            - SEMANTIC
            - STANDARD
            - RECIPIENT
            - SYSTEM
        canonicalPath:
          type: string
        sourcePath:
          type:
            - string
            - "null"
        ruleId:
          type:
            - string
            - "null"
        messageKey:
          type: string
        parameters:
          type: object
        evidenceSource:
          type:
            - string
            - "null"
      required:
        - code
        - severity
        - layer
        - canonicalPath
        - sourcePath
        - ruleId
        - messageKey
        - parameters
        - evidenceSource
      additionalProperties: false
    PendingRun:
      type: object
      properties:
        validationRunId:
          type: string
        status:
          const: PENDING
      required:
        - validationRunId
        - status
      additionalProperties: false
    CreatedInvoice:
      type: object
      properties:
        invoiceId:
          type: string
        revisionId:
          type: string
        revisionNumber:
          type: integer
        status:
          type: string
        canonicalSha256:
          type: string
        validationSummary:
          type:
            - object
            - "null"
      required:
        - invoiceId
        - revisionId
        - revisionNumber
        - status
        - canonicalSha256
        - validationSummary
      additionalProperties: false
    InvoiceSummary:
      type: object
      properties:
        invoiceId:
          type: string
        currentRevisionId:
          type: string
        revisionNumber:
          type: integer
        sourceSystem:
          type: string
        sourceRecordId:
          type: string
        documentNumber:
          type: string
        buyerName:
          type: string
        issueDate:
          type: string
        currency:
          type: string
        payableAmount:
          type: string
        status:
          type: string
        validationResult:
          type:
            - string
            - "null"
        standardResult:
          type:
            - string
            - "null"
        recipientCoverage:
          type: string
        updatedAt:
          type: string
      required:
        - invoiceId
        - currentRevisionId
        - revisionNumber
        - sourceSystem
        - sourceRecordId
        - documentNumber
        - buyerName
        - issueDate
        - currency
        - payableAmount
        - status
        - validationResult
        - standardResult
        - recipientCoverage
        - updatedAt
      additionalProperties: false
    InvoiceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceSummary"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      additionalProperties: false
    ValidationRun:
      type: object
      properties:
        validationRunId:
          type: string
        status:
          enum:
            - PENDING
            - PASS
            - FAIL
            - ERROR
        kind:
          type: string
        ruleManifest:
          type: object
        engineVersion:
          type: string
        recipientProfileVersionId:
          type:
            - string
            - "null"
        recipientSnapshot:
          type:
            - object
            - "null"
        summary:
          type: object
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        createdAt:
          type: string
        completedAt:
          type:
            - string
            - "null"
        xmlSha256:
          type:
            - string
            - "null"
      required:
        - validationRunId
        - status
        - kind
        - ruleManifest
        - engineVersion
        - recipientProfileVersionId
        - recipientSnapshot
        - summary
        - findings
        - createdAt
        - completedAt
        - xmlSha256
      additionalProperties: false
    Approval:
      type: object
      properties:
        approvalId:
          type: string
        revisionId:
          type: string
        canonicalSha256:
          type: string
        approvedAt:
          type: string
        approver:
          type: string
      required:
        - approvalId
        - revisionId
        - canonicalSha256
        - approvedAt
        - approver
      additionalProperties: false
    Revision:
      type: object
      properties:
        revisionId:
          type: string
        invoiceId:
          type: string
        revisionNumber:
          type: integer
        canonical:
          $ref: "#/components/schemas/Invoice"
        canonicalSha256:
          type: string
        sourceArtifact:
          type: object
        status:
          type: string
        validationRuns:
          type: array
          items:
            $ref: "#/components/schemas/ValidationRun"
        approval:
          type:
            - object
            - "null"
        artifacts:
          type: array
          items:
            type: object
      required:
        - revisionId
        - invoiceId
        - revisionNumber
        - canonical
        - canonicalSha256
        - sourceArtifact
        - status
        - validationRuns
        - approval
        - artifacts
      additionalProperties: false
    Artifact:
      type: object
      properties:
        artifactId:
          type: string
        invoiceId:
          type: string
        revisionId:
          type: string
        syntax:
          const: XRECHNUNG_UBL
        profile:
          type: string
        generatorVersion:
          type: string
        sha256:
          type: string
        createdAt:
          type: string
        validationStatus:
          type: string
      required:
        - artifactId
        - invoiceId
        - revisionId
        - syntax
        - profile
        - generatorVersion
        - sha256
        - createdAt
        - validationStatus
