name: Verify Release A
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify 2>&1 | tee /tmp/fakturapass-verification.log
        shell: bash
      - run: npm run release:images
        env:
          VERIFICATION_LOG: /tmp/fakturapass-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: .data/releases/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/

  validator-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run test:source-evidence
      - run: npm run test:security
      - run: npm run release:validator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validator-security-evidence
          path: .data/releases/
          include-hidden-files: true
          retention-days: 30
